name: Deploy web to Pages

# Builds the `web/` front-end — compiling `svg3-web` to WebAssembly with
# wasm-pack and bundling with rsbuild — and publishes the static site to GitHub
# Pages. No GPU is needed: WebGPU runs in the visitor's browser, not in CI; this
# job only compiles wasm and bundles assets, so it runs on `ubuntu-latest`.
#
# One-time setup: in the repository settings, set Pages → Build and deployment →
# Source to "GitHub Actions".

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "svg3-web/**"
      - "svg3/**"
      - ".cargo/config.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow one Pages deployment at a time; never cancel an in-progress publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs (not mutable tags)
      # for supply-chain integrity; the trailing comment records the release.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain + wasm target
        run: rustup show && rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build wasm (release)
        run: pnpm wasm:build
        working-directory: web

      - name: Build site
        run: pnpm build
        working-directory: web
        env:
          # Resolve assets / the worker / the wasm under the `/svg3/` project
          # path (rsbuild `output.assetPrefix`).
          PAGES: "1"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
