name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The whole pipeline runs on a single macOS runner. `svg3-render`
  # rasterises with wgpu and its headless render test needs a real GPU
  # adapter (Metal), and `app-macos` (winit -> Cocoa) only builds on macOS.
  # The CodSpeed benchmark uses `walltime` mode: the default CPU-simulation
  # mode needs Valgrind, which is Linux-only. Walltime on a shared hosted
  # runner is noisier than a dedicated CodSpeed macro runner — accepted here
  # to keep CI on one runner.
  ci:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      # Third-party actions are pinned to full commit SHAs (not mutable
      # tags) for supply-chain integrity. The trailing comment records the
      # human-readable release the SHA corresponds to.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install toolchain
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo tools
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: cargo-llvm-cov,cargo-codspeed

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test & generate coverage
        # `cargo llvm-cov` runs the tests under instrumentation and emits
        # an LCOV file; one step replaces the separate `cargo test` and
        # coverage runs. The headless `svg3-render` render test exercises
        # the Metal GPU here. `app-macos` is excluded from coverage — its
        # windowed event loop is not unit-testable.
        run: cargo llvm-cov --workspace --exclude app-macos --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: lcov.info
          # Optional on public repos (tokenless upload works); required on
          # private repos. The secret is read if present and otherwise
          # ignored.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build app-macos
        run: cargo build -p app-macos

      - name: Test app-macos
        run: cargo test -p app-macos

      - name: Build benchmarks
        run: cargo codspeed build --workspace --exclude app-macos

      - name: Run benchmarks (CodSpeed walltime)
        uses: CodSpeedHQ/action@3194d9a39c4d46684cb44bf7207fc56626aad8fd # v4.15.1
        with:
          mode: walltime
          run: cargo codspeed run
