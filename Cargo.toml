[workspace]
resolver = "2"
members = ["svg3", "svg3-cli", "app-macos"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
# Internal crates
svg3 = { path = "svg3" }

# Graphics
wgpu = "29"
winit = "0.30"            # 0.30 stable; 0.31 is beta — avoid
pollster = "0.4"
bytemuck = "1"

# Math
glam = "0.32"

# Geometry
lyon_tessellation = "1"

# Parsing
base64 = { version = "0.22", default-features = false, features = ["std"] }
quick-xml = "0.40"
svgtypes = "0.16"

# Diagnostics
log = "0.4"
env_logger = "0.11"
thiserror = "2"

# App / platform
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Benchmarking
# `codspeed-criterion-compat` is a drop-in replacement for `criterion` that
# also instruments runs for CodSpeed. Declaring it under the `criterion`
# name (via `package = ...`) means downstream crates write the usual
# `use criterion::*;` and `cargo bench` / `cargo codspeed build` both
# produce the right binary.
criterion = { package = "codspeed-criterion-compat", version = "4" }

# Images / testing
# `png` decodes embedded `<feImage>` PNG data URLs at render time and
# encodes/decodes the golden images for svg3's snapshot tests.
png = "0.18"
