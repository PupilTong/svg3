<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- A plain 2D SVG (no extension="pupiltong"): gradients, opacity, and
       painter compositing. Render it with:  svg3 shapes.svg -o shapes.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="warm" x1="120" y1="120" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="cool" x1="200" y1="120" x2="440" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ad7f0"/>
      <stop offset="1" stop-color="#4361ee"/>
    </linearGradient>
    <linearGradient id="berry" x1="160" y1="240" x2="360" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7a1c4"/>
      <stop offset="1" stop-color="#c1495f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="205" cy="205" r="125" fill="url(#warm)" opacity="0.85"/>
  <circle cx="325" cy="205" r="125" fill="url(#cool)" opacity="0.8"/>
  <circle cx="265" cy="320" r="125" fill="url(#berry)" opacity="0.8"/>
</svg>
